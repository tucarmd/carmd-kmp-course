          - "2. Swift cho dev TypeScript": lessons/02-swift-cho-dev-typescript.md
          - "3. Android cơ bản": lessons/03-android-co-ban.md
          - "4. iOS cơ bản": lessons/04-ios-co-ban.md
          - "5. Giải phẫu project KMP": lessons/05-giai-phau-project-kmp.md
      - "Tuần 2":
          - "6. UI declarative: thành phần": lessons/06-ui-declarative-thanh-phan.md
          - "7. UI declarative: danh sách": lessons/07-ui-declarative-danh-sach.md
          - "8. ViewModel dùng chung": lessons/08-viewmodel-dung-chung.md
          - "9. Kotlin↔Swift với SKIE": lessons/09-kotlin-swift-voi-skie.md
          - "10. Lục giác: app core, port, adapter": lessons/10-luc-giac.md
      - "Tuần 3":
          - "11. Kiểm thử app core + Koin": lessons/11-kiem-thu-va-koin.md
          - "12. Quyền truy cập": lessons/12-quyen-truy-cap.md
          - "13. BLE: khái niệm và quét": lessons/13-ble-khai-niem-va-quet.md
          - "14. BLE: kết nối": lessons/14-ble-ket-noi.md
          - "15. BLE: khám phá và đọc": lessons/15-ble-kham-pha-va-doc.md
      - "Tuần 4":
          - "16. BLE: notify, ngắt kết nối, lỗi": lessons/16-ble-notify-ngat-ket-noi-loi.md
          - "17. Trạng thái máy và kho log": lessons/17-trang-thai-may-va-kho-log.md
          - "18. Giám sát nền: dựng nó": lessons/18-giam-sat-nen.md
